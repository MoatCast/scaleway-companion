name: Bug report
description: Report unexpected app behavior
body:
  - type: markdown
    attributes:
      value: "Do not include keys, tokens, callback URLs, account identifiers, billing details or unredacted screenshots. Report vulnerabilities privately through the Security tab."
  - type: input
    id: environment
    attributes:
      label: App commit/version and iOS version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Prefer demo mode or fictional data where possible.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
